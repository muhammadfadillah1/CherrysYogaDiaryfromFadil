<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cherry's Yoga Diary</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF3F6;--card:#fff;--ink:#5B3A4A;--muted:#9A7B8A;--pink:#FFC9DA;--pink-d:#F28FB1;--lav:#E9DEFF;--mint:#D3F0DE;--butter:#FFE9A8;--line:#F3CBD9;--shadow:#F6B8CE;--red:#D6455D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A1F2B;--card:#3A2B3C;--ink:#FFE9F1;--muted:#C9A6B8;--pink:#6E3550;--pink-d:#FF9BC0;--lav:#4B3F70;--mint:#2F5A47;--butter:#6B5A2A;--line:#573E55;--shadow:#1E1520}}
:root[data-theme="dark"]{--bg:#2A1F2B;--card:#3A2B3C;--ink:#FFE9F1;--muted:#C9A6B8;--pink:#6E3550;--pink-d:#FF9BC0;--lav:#4B3F70;--mint:#2F5A47;--butter:#6B5A2A;--line:#573E55;--shadow:#1E1520}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(var(--line) 1.5px,transparent 1.6px) 0 0/24px 24px var(--bg);color:var(--ink);font:700 15px/1.45 'Nunito',ui-rounded,system-ui,sans-serif}
h1,h2,h3,.big,.clock{font-family:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;font-weight:600;margin:0}
main{max-width:460px;margin:0 auto;padding:16px 16px 120px}
.view{display:grid;gap:14px}
h2{font-size:20px}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:16px;box-shadow:0 5px 0 var(--shadow)}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.chy{width:72px;height:72px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
h1{font-size:23px;line-height:1.15}
#name{font:inherit;color:var(--red);background:none;border:0;border-bottom:2px dashed var(--pink-d);width:6.5ch;padding:0;outline:none}
#greet{margin:4px 0 0;color:var(--muted);font-size:13px}
.badge{display:grid;justify-items:center;background:var(--pink);border:2px solid var(--pink-d);border-radius:20px;padding:6px 12px;line-height:1.15}
.badge b{font:600 22px 'Fredoka',sans-serif}.badge small{font-size:11px;color:var(--muted)}
.note,.bub{padding:10px 14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px 20px 20px 4px;font:inherit;font-size:14px;text-align:left;box-shadow:0 3px 0 var(--shadow)}
.note{cursor:pointer;width:100%}
.tag{display:inline-block;background:var(--pink);color:var(--red);border-radius:999px;padding:3px 12px;font-size:12px}
